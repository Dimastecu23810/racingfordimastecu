<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RACING FOR DIMASTECU</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909;color:#fff;font-family:system-ui,Arial;touch-action:none}button{border:0;border-radius:12px;padding:14px;background:#292929;color:white;font-weight:800;font-size:15px}.primary{background:#ff7800;color:#111}.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:radial-gradient(ellipse at top,#381b08,#090909 70%)}.screen.active{display:flex}.menu{width:min(400px,100%);text-align:center}.logo{font-size:clamp(32px,9vw,52px);line-height:.95;font-weight:1000}.logo span{color:#ff7800}.sub{color:#aaa;letter-spacing:3px;font-size:11px;margin:20px 0 28px}.buttons{display:grid;gap:12px;max-width:300px;margin:auto}.note{color:#888;font-size:11px;line-height:1.5;margin-top:24px}.panel{width:min(380px,100%);padding:22px;background:#171717;border:1px solid #444;border-radius:18px}.panel h2{color:#ff7800;margin-top:0}.panel p{color:#ddd;line-height:1.5}.panel button{width:100%;margin-top:8px}#game{display:none;position:absolute;inset:0}#game.active{display:block}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;pointer-events:none}.chip{background:#080808dd;border:1px solid #ffffff33;border-radius:10px;padding:7px 9px;min-width:65px}.chip small{font-size:9px;color:#aaa;display:block}.chip b{font-size:16px}.hud button{pointer-events:auto;padding:8px 12px;margin-left:auto}.overlay{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}
</style></head><body>
<section id="lobby" class="screen active"><div class="menu"><div style="font-size:38px">🏁</div><h1 class="logo">RACING <span>FOR</span><br>DIMASTECU</h1><div class="sub">HIGHWAY RUSH · MOBILE EDITION</div><div class="buttons"><button class="primary" id="start">▶ START RACE</button><button id="settings">⚙ SETTINGS</button><button id="records">🏆 RECORDS</button></div><div class="note">3 LAPS · 15 KM · TOUCH & DRAG CONTROL<br>MADE FOR DIMASTECU</div></div></section>
<section id="settingsScreen" class="screen"><div class="panel"><h2>SETTINGS</h2><p>Geser jari di layar untuk menggerakkan mobil ke kiri, kanan, depan, atau belakang.</p><button id="backSettings">KEMBALI</button></div></section>
<section id="recordsScreen" class="screen"><div class="panel"><h2>RECORDS</h2><p>Jarak terbaik: <b id="best">0.00 km</b></p><button id="backRecords">KEMBALI</button></div></section>
<div id="game"><canvas id="c"></canvas><div class="hud"><div class="chip"><small>LAP</small><b id="lap">1/3</b></div><div class="chip"><small>DISTANCE</small><b id="dist">0.00 km</b></div><div class="chip"><small>SPEED</small><b id="spd">120</b></div><button id="pause">Ⅱ</button></div><div id="overlay" class="overlay"><div class="panel"><h2 id="overTitle">PAUSED</h2><p id="overText">Balapan dijeda.</p><button class="primary" id="resume">LANJUT</button><button id="restart">ULANGI</button><button id="home">LOBBY</button></div></div></div>
<script>
(()=>{const $=id=>document.getElementById(id),c=$('c'),x=c.getContext('2d');let W=360,H=640,dpr=1,playing=false,paused=false,over=false,last=0,meters=0,speed=120,scroll=0,px=.5,py=.78,tx=null,ty=null,cars=[];let best=Number(localStorage.getItem('dimastecuBest')||0);$('best').textContent=(best/1000).toFixed(2)+' km';function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);draw()}addEventListener('resize',size);function bounds(y){let half=W*(.28+.12*y/H);return{l:W/2-half,r:W/2+half}}function car(cx,cy,w,h,color,kind){x.save();x.translate(cx,cy);x.fillStyle='#111';x.fillRect(-w*.52,-h*.3,w*.15,h*.22);x.fillRect(w*.37,-h*.3,w*.15,h*.22);x.fillRect(-w*.52,h*.15,w*.15,h*.22);x.fillRect(w*.37,h*.15,w*.15,h*.22);x.fillStyle=color;x.beginPath();x.roundRect(-w*.42,-h*.5,w*.84,h,Math.max(4,w*.16));x.fill();if(kind==='truck'){x.fillStyle='#b9c7cc';x.fillRect(-w*.3,-h*.4,w*.6,h*.32)}else{x.fillStyle='#17313e';x.fillRect(-w*.29,-h*.25,w*.58,h*.28)}x.fillStyle='#fff3bb';x.fillRect(-w*.27,-h*.48,w*.15,3);x.fillRect(w*.12,-h*.48,w*.15,3);x.fillStyle='#ff2222';x.fillRect(-w*.27,h*.42,w*.15,3);x.fillRect(w*.12,h*.42,w*.15,3);x.restore()}function draw(){if(!x)return;x.clearRect(0,0,W,H);x.fillStyle='#286235';x.fillRect(0,0,W,H);for(let y=-60+(scroll%60);y<H+60;y+=60){x.fillStyle='#347b3e';x.fillRect(0,y,W,2)}let a=bounds(0),b=bounds(H);x.fillStyle='#34373b';x.beginPath();x.moveTo(a.l,0);x.lineTo(a.r,0);x.lineTo(b.r,H);x.lineTo(b.l,H);x.closePath();x.fill();x.strokeStyle='#eee';x.lineWidth=3;x.beginPath();x.moveTo(a.l,0);x.lineTo(b.l,H);x.moveTo(a.r,0);x.lineTo(b.r,H);x.stroke();for(let y=-50+(scroll%50);y<H+50;y+=50){let z=bounds(Math.max(0,y));x.fillStyle='#eee';x.fillRect(z.l+(z.r-z.l)/3-2,y,4,24);x.fillRect(z.l+2*(z.r-z.l)/3-2,y,4,24)}for(let v of cars){let q=bounds(v.y),cx=q.l+v.lane*(q.r-q.l);car(cx,v.y,v.kind==='truck'?W*.1:W*.08,H*.085,v.color,v.kind)}let q=bounds(py*H);car(q.l+px*(q.r-q.l),py*H,W*.105,H*.105,'#e51e24','player')}function reset(){meters=0;speed=120;scroll=0;px=.5;py=.78;cars=[];for(let i=0;i<7;i++)cars.push({y:-i*H*.8-80,lane:.2+Math.random()*.6,color:['#31a64b','#f06b22','#2478df','#ddd','#edc12b'][i%5],kind:i===0?'truck':'car'});$('overlay').classList.remove('show');over=false;draw()}function show(id){['lobby','settingsScreen','recordsScreen'].forEach(v=>$(v).classList.toggle('active',v===id));$('game').classList.remove('active')}function start(){reset();show('lobby');$('lobby').classList.remove('active');$('game').classList.add('active');playing=true;paused=false;last=performance.now();requestAnimationFrame(loop)}function finish(){playing=false;over=true;best=Math.max(best,meters);localStorage.setItem('dimastecuBest',best);$('best').textContent=(best/1000).toFixed(2)+' km';$('overTitle').textContent='FINISH! 🏁';$('overText').textContent='Mantap! Lu menyelesaikan 3 lap.';$('resume').style.display='none';$('overlay').classList.add('show')}function loop(t){if(!playing)return;let dt=Math.min((t-last)/1000||0,.04);last=t;speed=Math.min(300,120+meters/100);meters+=speed/3.6*dt;scroll+=speed*.8*dt;$('dist').textContent=(meters/1000).toFixed(2)+' km';$('spd').textContent=Math.round(speed)+' km/h';$('lap').textContent=Math.min(3,Math.floor(meters/5000)+1)+'/3';cars.forEach(v=>{v.y+=dt*(H*.24+speed*.55);if(v.y>H+80){v.y=-100-Math.random()*180;v.lane=.18+Math.random()*.64;v.kind=Math.random()<.2?'truck':'car';v.color=['#31a64b','#f06b22','#2478df','#ddd'][Math.floor(Math.random()*4)]}});if(meters>=15000){finish();draw();return}draw();requestAnimationFrame(loop)}$('start').onclick=start;$('settings').onclick=()=>show('settingsScreen');$('records').onclick=()=>show('recordsScreen');$('backSettings').onclick=()=>show('lobby');$('backRecords').onclick=()=>show('lobby');$('pause').onclick=()=>{if(!playing)return;playing=false;paused=true;$('overTitle').textContent='PAUSED';$('overText').textContent='Balapan dijeda.';$('resume').style.display='block';$('overlay').classList.add('show')};$('resume').onclick=()=>{if(over){start();return}$('overlay').classList.remove('show');playing=true;paused=false;last=performance.now();requestAnimationFrame(loop)};$('restart').onclick=start;$('home').onclick=()=>{playing=false;show('lobby');$('overlay').classList.remove('show')};c.addEventListener('pointerdown',e=>{if(!playing)return;e.preventDefault();c.setPointerCapture(e.pointerId);tx=e.clientX;ty=e.clientY});c.addEventListener('pointermove',e=>{if(!playing||tx===null)return;e.preventDefault();px=Math.max(.08,Math.min(.92,px+(e.clientX-tx)/W*1.7));py=Math.max(.48,Math.min(.9,py+(e.clientY-ty)/H*1.7));tx=e.clientX;ty=e.clientY;draw()});function release(){tx=ty=null}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);size();})();
</script></body></html>
